[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbs-fantasy-tooling"
version = "0.1.0"
description = "CBS Sports fantasy football data scraping and analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "sendgrid",
    "python-dotenv",
    "requests",
    "numpy",
    "pandas",
    "matplotlib",
    "squarify",
    "inquirerpy",  # Interactive CLI menus
    "supabase",    # Database storage provider
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Range-pinned so local and CI run the same formatter/linter generation.
    "black>=25,<26",
    "ruff>=0.16,<0.17",
]

[project.scripts]
cbs-scrape = "cbs_fantasy_tooling.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cbs_fantasy_tooling*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's defaults expanded in 0.16 and turned a
# clean tree into 300 CI findings overnight; broaden this deliberately, not
# by upgrade.
select = [
    "E4", "E7", "E9", "F",
    # Rules adopted after applying ruff's safe auto-fixes; enforced so they cannot regress.
    "FURB105", "I001", "PIE790", "PLR1730", "RUF010", "RUF019", "RUF022", "UP006", "UP045",
]
